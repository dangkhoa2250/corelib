[package]
name = "library_desktop"
version = "0.1.0"
description = "Library desktop application"
authors = ["you"]
edition = "2021"
default-run = "library_desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "library_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fsrs = "=6.6.0"
libc = "0.2"
# Pure-Rust PDF text extractor selected from the current lopdf 0.43.0 docs.
lopdf = "0.43"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
keyring = "2"
base64 = "0.22.1"
reqwest = { version = "0.13", features = ["json", "stream", "blocking", "form", "query"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
