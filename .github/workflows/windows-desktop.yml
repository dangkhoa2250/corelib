name: Windows desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - main
      - feat/windows-desktop
    paths:
      - "apps/desktop/**"
      - ".github/workflows/windows-desktop.yml"

jobs:
  test-and-bundle:
    runs-on: windows-latest
    env:
      ACCOUNT_API_BASE_URL: ${{ vars.ACCOUNT_API_BASE_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test frontend
        working-directory: apps/desktop
        run: npm test

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Test Rust backend
        working-directory: apps/desktop
        run: cargo test --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust backend
        working-directory: apps/desktop
        run: cargo clippy --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings -A linker-messages

      - name: Build unsigned local NSIS installer
        working-directory: apps/desktop
        run: npm run tauri:build:windows

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: library-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
